name: Deploy PWA to EAS Hosting

# Runs whenever a commit lands on master — which is exactly what happens when
# a PR is merged. No manual `expo export` + `eas deploy` needed anymore.
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # expo/expo-github-action's yarn-based eas-cli install has been flaky
      # (fails with "yarn failed with exit code 1" on newer eas-cli/runner
      # combos), so install eas-cli directly via npm instead.
      - name: Setup EAS CLI
        run: npm install --global eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx expo export -p web

      - name: Deploy to production
        run: eas deploy --prod --non-interactive
